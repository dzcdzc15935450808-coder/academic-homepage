<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Name — Academic Homepage</title>
<meta name="description" content="Personal academic homepage of Your Name." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" id="brand-name">Your Name</a>
    <nav class="nav" id="nav">
      <a href="#research">Research</a>
      <a href="#news">News</a>
      <a href="#publications">Publications</a>
      <a href="#projects">Projects</a>
      <a href="#awards">Awards</a>
      <a href="#teaching">Teaching</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="lang-switch" id="lang-switch"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
  </div>
</header>

<div class="layout" id="top">

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="avatar" id="avatar">YN</div>
    <h1 class="name" id="name">Your Name</h1>
    <p class="role" id="role"></p>
    <p class="affiliation" id="affiliation"></p>
    <p class="email" id="email"></p>

    <div class="links" id="links"></div>

    <div class="interests" id="interests"></div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">

    <section class="section" id="about">
      <h2 class="section-title" id="title-about"></h2>
      <div id="bio"></div>
    </section>

    <section class="section" id="research">
      <h2 class="section-title" id="title-research"></h2>
      <div class="card research-card" id="research-block"></div>
    </section>

    <section class="section" id="news">
      <h2 class="section-title" id="title-news"></h2>
      <ul class="news-list" id="news-list"></ul>
    </section>

    <section class="section" id="publications">
      <h2 class="section-title" id="title-publications"></h2>
      <p class="section-sub" id="pub-note"></p>
      <div id="pub-list"></div>
    </section>

    <section class="section" id="projects">
      <h2 class="section-title" id="title-projects"></h2>
      <div class="cards" id="project-list"></div>
    </section>

    <section class="section" id="awards">
      <h2 class="section-title" id="title-awards"></h2>
      <ul class="simple-list" id="award-list"></ul>
    </section>

    <section class="section" id="teaching">
      <h2 class="section-title" id="title-teaching"></h2>
      <ul class="simple-list" id="teaching-list"></ul>
    </section>

    <section class="section" id="contact">
      <h2 class="section-title" id="title-contact"></h2>
      <div id="contact-block"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
