<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>董哲诚 — 个人学术主页</title>
<meta name="description" content="Personal academic homepage of Zhecheng Dong (董哲诚), Ph.D. student in Art History at the University of Barcelona." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2317140f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f6f1e8' font-family='Georgia'>D</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" id="brand-name">Zhecheng Dong</a>
    <nav class="nav" id="nav">
      <a href="#about"></a>
      <a href="#news"></a>
      <a href="#publications"></a>
      <a href="#projects"></a>
      <a href="#awards"></a>
      <a href="#contact"></a>
    </nav>
    <div class="lang-switch" id="lang-switch"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
    <span class="lang-select-wrap">
      <select class="lang-select" id="lang-select"></select>
    </span>
  </div>
</header>

<div class="layout" id="top">

  <!-- ===== Sidebar: the program-note colophon ===== -->
  <aside class="sidebar">
    <figure class="film-still">
      <div class="still-frame"><img id="photo" src="photo.jpg" alt="Portrait of Zhecheng Dong" /></div>
      <figcaption id="photo-caption"></figcaption>
    </figure>

    <h1 class="name" id="name"></h1>
    <p class="role" id="role"></p>
    <p class="affiliation" id="affiliation"></p>

    <div class="emails" id="emails"></div>
    <div class="links" id="links"></div>
    <div class="interests" id="interests"></div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">

    <section class="section" id="about">
      <h2 class="section-title" id="title-about"></h2>
      <div id="bio"></div>
    </section>

    <section class="section" id="news">
      <h2 class="section-title" id="title-news"></h2>
      <ul class="news-list" id="news-list"></ul>
    </section>

    <section class="section" id="publications">
      <h2 class="section-title" id="title-publications"></h2>
      <p class="section-sub" id="pub-note"></p>
      <div id="pub-list"></div>
    </section>

    <section class="section" id="projects">
      <h2 class="section-title" id="title-projects"></h2>
      <div id="project-list"></div>
    </section>

    <section class="section" id="awards">
      <h2 class="section-title" id="title-awards"></h2>
      <ul class="simple-list" id="award-list"></ul>
    </section>

    <section class="section" id="teaching">
      <h2 class="section-title" id="title-teaching"></h2>
      <ul class="simple-list" id="teaching-list"></ul>
    </section>

    <section class="section" id="contact">
      <h2 class="section-title" id="title-contact"></h2>
      <div id="contact-block"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
