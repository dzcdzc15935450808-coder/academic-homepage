<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>董哲诚 — 个人学术主页</title>
<meta name="description" content="Personal academic homepage of Zhecheng Dong (董哲诚), Ph.D. student in Art History at the University of Barcelona." />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2317140f'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23f6f1e8' font-family='Georgia'>D</text></svg>" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top" id="brand-name">Zhecheng Dong</a>
    <nav class="nav" id="nav">
      <a href="#about"></a>
      <a href="#news"></a>
      <a href="#projects"></a>
      <a href="#awards"></a>
      <a href="#contact"></a>
    </nav>
    <div class="lang-switch" id="lang-switch"></div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">◐</button>
    <span class="lang-select-wrap">
      <select class="lang-select" id="lang-select"></select>
    </span>
  </div>
</header>

<div class="layout" id="top">

  <!-- ===== Sidebar: the program-note colophon ===== -->
  <aside class="sidebar">
    <figure class="film-still">
      <div class="still-frame"><img id="photo" src="photo.jpg" alt="Portrait of Zhecheng Dong" /></div>
      <figcaption id="photo-caption"></figcaption>
    </figure>

    <h1 class="name" id="name"></h1>
    <p class="role" id="role"></p>
    <p class="affiliation" id="affiliation"></p>

    <div class="emails" id="emails"></div>
    <div class="links" id="links"></div>
    <div class="interests" id="interests"></div>

    <div class="city-study" id="city-study">
      <button class="city-study-button" id="city-study-replay" type="button" aria-label="重播城市与取景框动效">
        <!-- An abstract street plan, not a map of a particular city. -->
        <svg class="city-plan" viewBox="0 0 264 124" fill="none" aria-hidden="true" focusable="false">
          <g class="city-blocks" stroke="currentColor" stroke-width="1" stroke-linejoin="round">
            <path pathLength="1" d="M14 16H48L52 20V39L48 43H14Z" />
            <path pathLength="1" d="M63 16H97L101 20V39L97 43H63L59 39V20Z" />
            <path pathLength="1" d="M112 16H146L150 20V39L146 43H112L108 39V20Z" />
            <path pathLength="1" d="M161 16H195L199 20V39L195 43H161L157 39V20Z" />
            <path pathLength="1" d="M210 16H244L248 20V43H210L206 39V20Z" />
            <path pathLength="1" d="M14 54H48L52 58V77L48 81H14Z" />
            <path pathLength="1" d="M63 54H97L101 58V77L97 81H63L59 77V58Z" />
            <path pathLength="1" d="M112 54H146L150 58V77L146 81H112L108 77V58Z" />
            <path pathLength="1" d="M161 54H195L199 58V77L195 81H161L157 77V58Z" />
            <path pathLength="1" d="M210 54H244L248 58V81H210L206 77V58Z" />
            <path pathLength="1" d="M14 92H48L52 96V114H14Z" />
            <path pathLength="1" d="M63 92H97L101 96V114H59V96Z" />
            <path pathLength="1" d="M112 92H146L150 96V114H108V96Z" />
            <path pathLength="1" d="M161 92H195L199 96V114H157V96Z" />
            <path pathLength="1" d="M210 92H244L248 96V114H206V96Z" />
          </g>
          <path class="city-route" pathLength="1" d="M8 87H79L119 49H256" />
          <g class="city-memory" stroke="currentColor" stroke-width="1">
            <path d="M63 40V22H83 M183 22H203V40 M203 86V104H183 M83 104H63V86" />
          </g>
          <g class="city-viewfinder" stroke="currentColor" stroke-width="1.6" stroke-linecap="square">
            <path pathLength="1" d="M74 43V29H94 M190 29H210V43 M210 91V105H190 M94 105H74V91" />
            <path class="city-focus" d="M136 67H148 M142 61V73" stroke-width="1" />
          </g>
        </svg>
        <span class="city-caption">
          <span id="city-study-caption">城市 · 影像 · 记忆</span>
          <svg class="city-replay" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
            <path d="M3.2 6A5 5 0 1 1 3 9 M3 2.5V6H6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
      </button>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <main class="main">

    <section class="section" id="about">
      <h2 class="section-title" id="title-about"></h2>
      <div id="bio"></div>
    </section>

    <section class="section" id="news">
      <h2 class="section-title" id="title-news"></h2>
      <ul class="news-list" id="news-list"></ul>
    </section>

    <section class="section" id="publications">
      <h2 class="section-title" id="title-publications"></h2>
      <p class="section-sub" id="pub-note"></p>
      <div id="pub-list"></div>
    </section>

    <section class="section" id="projects">
      <h2 class="section-title" id="title-projects"></h2>
      <div id="project-list"></div>
    </section>

    <section class="section" id="awards">
      <h2 class="section-title" id="title-awards"></h2>
      <ul class="simple-list" id="award-list"></ul>
    </section>

    <section class="section" id="teaching">
      <h2 class="section-title" id="title-teaching"></h2>
      <ul class="simple-list" id="teaching-list"></ul>
    </section>

    <section class="section" id="contact">
      <h2 class="section-title" id="title-contact"></h2>
      <div id="contact-block"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
